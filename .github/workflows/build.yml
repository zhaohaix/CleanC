name: Windows build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build CleanC.sln -c Release
      - run: dotnet run --project tests/CleanC.Core.Tests -c Release --no-build
      - run: dotnet run --project tests/CleanC.ChatStorage.Tests -c Release --no-build
